<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Vision — How Animals See the World | VATSAL.LOL</title>
    <link rel="canonical" href="https://vatsal.lol/pages/vision/" />
    <meta name="description" content="Simulate how different animal species perceive the world. An interactive biological optics and spectrum simulator on VATSAL.LOL." />

    <!-- Open Graph Metadata -->
    <meta property="og:site_name" content="vatsal.lol" />
    <meta property="og:title" content="Vision — How Animals See the World | VATSAL.LOL" />
    <meta property="og:description" content="Simulate how different animal species perceive the world. An interactive biological optics and spectrum simulator on VATSAL.LOL." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vatsal.lol/pages/vision/" />
    <meta property="og:image" content="https://vatsal.lol/assets/thumbnails/vision.webp" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vision — How Animals See the World | VATSAL.LOL" />
    <meta name="twitter:description" content="Simulate how different animal species perceive the world. An interactive biological optics and spectrum simulator on VATSAL.LOL." />
    <meta name="twitter:image" content="https://vatsal.lol/assets/thumbnails/vision.webp" />

    <!-- Favicon & PWA -->
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Platform Styles -->
    <link rel="stylesheet" href="../../assets/vatsal-v4.css" />

    <link rel="stylesheet" href="./src/index.css" />
  </head>
  <body>

    <!-- Top Navigation Header -->
    <header id="app-header">
      <div class="header-container">
        
        <!-- Brand Title -->
        <a href="/" id="vatsal-v4-logo" class="brand-wrapper" aria-label="Return to VATSAL.LOL home" style="text-decoration: none; color: inherit; cursor: pointer;">
          <div class="brand-logo-box">
            <div class="brand-logo-inner">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </div>
          </div>
          <div>
            <div class="brand-title-group">
              <h1 class="brand-title">
                VATSAL.LOL <span>— VISION</span>
              </h1>
              <span class="version-badge">
                v1.0
              </span>
            </div>
          </div>
        </a>

        <!-- View Controls & Preset Selector -->
        <div class="header-controls">
          
          <!-- Preset Selector Dropdown -->
          <div class="dropdown-wrapper">
            <span style="margin-right: 6px;">🖼️</span>
            <select id="preset-image-selector">
              <option value="01" selected>🌸 Flower Meadow</option>
              <option value="02">🌲 Forest</option>
              <option value="03">🌆 City Street</option>
              <option value="04">🌊 Beach</option>
              <option value="05">🌌 Night Sky</option>
              <option value="06">🪸 Coral Reef</option>
              <option value="07">🏔️ Snow Landscape</option>
              <option value="08">🌧️ Rainy Day</option>
            </select>
          </div>

          <!-- Upload Custom Image -->
          <button id="upload-custom-image-btn" class="btn-icon" title="Upload custom image">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent-sky);"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></svg>
            <span>Upload</span>
          </button>
          <input type="file" id="file-input" accept="image/*" class="hidden" />

          <!-- Mode Toggle: Split Slider vs Full View -->
          <div class="mode-toggle-group">
            <button id="view-mode-split-btn" class="mode-btn active">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M12 3v18"/></svg>
              <span>Split Slider</span>
            </button>
            <button id="view-mode-full-btn" class="mode-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              <span>Full View</span>
            </button>
          </div>

          <!-- Environment Parameters Button -->
          <button id="toggle-environment-btn" class="btn-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="21" y2="21"/><line x1="4" x2="20" y1="14" y2="14"/><line x1="4" x2="20" y1="7" y2="7"/><circle cx="8" cy="21" r="2"/><circle cx="16" cy="14" r="2"/><circle cx="12" cy="7" r="2"/></svg>
            <span>Optics Config</span>
          </button>

        </div>
      </div>
    </header>

    <!-- Main Workspace -->
    <main>
      
      <!-- Environment Parameters Drawer -->
      <div id="environment-controls-panel" class="hidden">
        <div class="env-drawer-grid">
          
          <!-- Lighting Selector -->
          <div class="env-group">
            <label class="env-label">
              <span>☀️</span> Ambient Lighting Condition:
            </label>
            <div id="lighting-buttons" class="env-buttons">
              <button data-lighting="bright" class="env-btn">Bright Sun</button>
              <button data-lighting="daylight" class="env-btn active">Daylight</button>
              <button data-lighting="twilight" class="env-btn">Twilight</button>
              <button data-lighting="night" class="env-btn">Night Darkness</button>
            </div>
          </div>

          <!-- Distance Slider -->
          <div class="env-group" style="min-width: 220px;">
            <div style="display: flex; justify-content: space-between; font-size: 0.75rem; font-weight: 700; color: var(--text-secondary);">
              <span>📏 Subject Distance:</span>
              <span id="distance-display" style="color: var(--accent-sky); font-family: var(--font-mono);">10 meters</span>
            </div>
            <input id="distance-slider" type="range" min="1" max="100" value="10" style="width: 100%; accent-color: #0284c7; height: 6px; cursor: pointer;" />
          </div>

          <!-- UV Guides Toggle -->
          <div style="display: flex; align-items: center; gap: 12px;">
            <button id="toggle-uv-btn" class="btn-icon">
              <span>✨</span>
              <span>UV Spectrum Overlay</span>
            </button>
          </div>

        </div>
      </div>

      <!-- TOP SECTION: Profile Selector | Perception Render Canvas -->
      <div class="workspace-grid">
        
        <!-- Left: Subject Selector List -->
        <section id="profile-selector-section">
          
          <!-- Search Input -->
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input id="search-input" type="text" placeholder="Search subjects..." />
          </div>

          <!-- Scrollable List of Subjects -->
          <div id="profile-list">
            <!-- Populated dynamically -->
          </div>
        </section>

        <!-- Right: Perception Render Canvas View -->
        <div style="display: flex; flex-direction: column; justify-content: center;">
          <div id="vision-canvas-container">
            <canvas id="perception-render-canvas"></canvas>

            <!-- Split Slider Hint Overlay -->
            <div id="split-hint">
              <span>Drag horizontally to compare Human vs Species Perception</span>
              <button id="reset-slider-btn" title="Reset 50/50 split">
                ↺
              </button>
            </div>
          </div>
        </div>

      </div>

      <!-- BELOW: Biology Inspector Panel -->
      <section id="biology-inspector-panel">
        <!-- Populated dynamically -->
      </section>

    </main>

    <!-- Footer -->
    <footer>
      <p>
        VATSAL.LOL — VISION Perception Engine &copy; 2026. Scientific light processing & biological optics simulation.
      </p>
    </footer>

    <script src="./app.js"></script>
    <script src="../../assets/vatsal-sdk.js" defer></script>
  </body>
</html>

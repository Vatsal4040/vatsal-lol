<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="920" height="180">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@800&amp;family=Oxanium:wght@800&amp;family=Syne:wght@800&amp;display=swap');

      @font-face {
        font-family: 'vatsallogofont';
        src: url('../assets/data/vatsal-logo-font.woff2') format('woff2'),
             url('/assets/data/vatsal-logo-font.woff2') format('woff2'),
             url('assets/data/vatsal-logo-font.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Vatsal-logo';
        src: url('../assets/data/vatsal-logo-font.woff2') format('woff2'),
             url('/assets/data/vatsal-logo-font.woff2') format('woff2'),
             url('assets/data/vatsal-logo-font.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      .canvas-bg {
        fill: transparent;
      }

      .title-node {
        dominant-baseline: central;
        text-anchor: middle;
      }

      /* 1. OXANIUM */
      .font-oxanium {
        font-family: 'Oxanium', sans-serif;
        font-weight: 800;
        font-size: 56px;
        letter-spacing: 0.12em;
        fill: #EDEDF0;
        animation: animOxanium 16s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      /* 2. JETBRAINS MONO */
      .font-jetbrains {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 800;
        font-size: 50px;
        letter-spacing: -0.01em;
        fill: #DDA135;
        animation: animJetBrains 16s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      /* 3. VATSALLOGOFONT */
      .font-vatsallogo {
        font-family: 'vatsallogofont', sans-serif;
        font-weight: normal;
        font-size: 60px;
        letter-spacing: 0.04em;
        fill: #EDEDF0;
        animation: animLogoFont 16s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      /* 4. SYNE */
      .font-syne {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 62px;
        letter-spacing: -0.03em;
        fill: #EDEDF0;
        animation: animSyne 16s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      .amber-cursor {
        fill: #DDA135;
        animation: blinkCursor 0.85s steps(2, start) infinite;
      }

      @keyframes animOxanium {
        0%        { opacity: 0; clip-path: inset(0 100% 0 0); }
        3%        { opacity: 1; }
        15%, 22%  { opacity: 1; clip-path: inset(0 0% 0 0); }
        24.8%     { opacity: 1; clip-path: inset(0 100% 0 0); }
        25%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }

      @keyframes animJetBrains {
        0%, 24.9% { opacity: 0; clip-path: inset(0 100% 0 0); }
        25%       { opacity: 1; clip-path: inset(0 100% 0 0); }
        28%       { opacity: 1; }
        40%, 47%  { opacity: 1; clip-path: inset(0 0% 0 0); }
        49.8%     { opacity: 1; clip-path: inset(0 100% 0 0); }
        50%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }

      @keyframes animLogoFont {
        0%, 49.9% { opacity: 0; clip-path: inset(0 100% 0 0); }
        50%       { opacity: 1; clip-path: inset(0 100% 0 0); }
        53%       { opacity: 1; }
        65%, 72%  { opacity: 1; clip-path: inset(0 0% 0 0); }
        74.8%     { opacity: 1; clip-path: inset(0 100% 0 0); }
        75%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }

      @keyframes animSyne {
        0%, 74.9% { opacity: 0; clip-path: inset(0 100% 0 0); }
        75%       { opacity: 1; clip-path: inset(0 100% 0 0); }
        78%       { opacity: 1; }
        90%, 97%  { opacity: 1; clip-path: inset(0 0% 0 0); }
        99.8%     { opacity: 1; clip-path: inset(0 100% 0 0); }
        100%      { opacity: 0; clip-path: inset(0 100% 0 0); }
      }

      @keyframes blinkCursor {
        0%, 49%   { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .font-oxanium, .font-jetbrains, .font-vatsallogo, .font-syne, .amber-cursor {
          animation: none !important;
        }
        .font-oxanium {
          opacity: 1 !important;
          clip-path: none !important;
        }
        .font-jetbrains, .font-vatsallogo, .font-syne {
          opacity: 0 !important;
        }
      }
    </style>
  </defs>

  <!-- 1. OXANIUM -->
  <g class="font-oxanium">
    <text class="title-node" x="460" y="90">VATSAL BHAVSAR</text>
  </g>

  <!-- 2. JETBRAINS MONO -->
  <g class="font-jetbrains">
    <text class="title-node" x="460" y="90">VATSAL_BHAVSAR</text>
  </g>

  <!-- 3. VATSALLOGOFONT -->
  <g class="font-vatsallogo">
    <text class="title-node" x="460" y="90">VATSAL BHAVSAR</text>
  </g>

  <!-- 4. SYNE -->
  <g class="font-syne">
    <text class="title-node" x="460" y="90">VATSAL BHAVSAR</text>
  </g>

  <rect class="amber-cursor" x="842" y="62" width="3.5" height="56" rx="1.5"/>
</svg>

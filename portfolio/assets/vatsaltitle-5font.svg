<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="920" height="180">
  <defs>
    <style>
      /* ---------------------------------------------------------
         LOCAL 5-FONT SUITE (Zero external Google Fonts / CDNs)
         Paths resolve relative to portfolio/assets/
         --------------------------------------------------------- */
      @font-face {
        font-family: 'Oxanium';
        src: url('Oxanium-VariableFont_wght.woff2') format('woff2');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'JetBrains Mono';
        src: url('JetBrainsMono-Bold.woff2') format('woff2');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Pixelify Sans';
        src: url('PixelifySans-VariableFont_wght%20(1).woff2') format('woff2'),
             url('PixelifySans-VariableFont_wght (1).woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'Syne';
        src: url('Syne-VariableFont_wght.woff2') format('woff2');
        font-weight: 800;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: 'vatsallogofont';
        src: url('vatsal-logo-font.woff2') format('woff2'),
             url('../../assets/data/vatsal-logo-font.woff2') format('woff2');
        font-weight: normal;
        font-style: normal;
        font-display: swap;
      }

      .canvas-bg {
        fill: transparent;
      }

      .title-node {
        dominant-baseline: central;
        text-anchor: middle;
      }

      /* 1. OXANIUM (State 1: 0% - 20%) */
      .font-oxanium {
        font-family: 'Oxanium', sans-serif;
        font-weight: 800;
        font-size: 56px;
        letter-spacing: 0.10em;
        fill: #EDEDF0;
        animation: animOxanium 20s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      /* 2. JETBRAINS MONO (State 2: 20% - 40%) */
      .font-jetbrains {
        font-family: 'JetBrains Mono', monospace;
        font-weight: 800;
        font-size: 50px;
        letter-spacing: -0.02em;
        fill: #DDA135;
        animation: animJetBrains 20s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      /* 3. PIXELIFY SANS (State 3: 40% - 60%) */
      .font-pixelify {
        font-family: 'Pixelify Sans', sans-serif;
        font-weight: 700;
        font-size: 54px;
        letter-spacing: 0.05em;
        fill: #EDEDF0;
        animation: animPixelify 20s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      /* 4. SYNE (State 4: 60% - 80%) */
      .font-syne {
        font-family: 'Syne', sans-serif;
        font-weight: 800;
        font-size: 60px;
        letter-spacing: -0.03em;
        fill: #EDEDF0;
        animation: animSyne 20s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      /* 5. VATSALLOGOFONT (State 5: 80% - 100%) */
      .font-vatsallogo {
        font-family: 'vatsallogofont', sans-serif;
        font-weight: normal;
        font-size: 58px;
        letter-spacing: 0.04em;
        fill: #EDEDF0;
        animation: animLogoFont 20s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }

      /* Blinking Amber Cursor */
      .amber-cursor {
        fill: #DDA135;
        animation: blinkCursor 0.8s steps(2, start) infinite;
      }

      /* Keyframes across 20s cycle (5 states @ 4.0s each) */
      @keyframes animOxanium {
        0%        { opacity: 0; clip-path: inset(0 100% 0 0); }
        2%        { opacity: 1; }
        12%, 17%  { opacity: 1; clip-path: inset(0 0% 0 0); }
        19.8%     { opacity: 1; clip-path: inset(0 100% 0 0); }
        20%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }

      @keyframes animJetBrains {
        0%, 19.9% { opacity: 0; clip-path: inset(0 100% 0 0); }
        20%       { opacity: 1; clip-path: inset(0 100% 0 0); }
        22%       { opacity: 1; }
        32%, 37%  { opacity: 1; clip-path: inset(0 0% 0 0); }
        39.8%     { opacity: 1; clip-path: inset(0 100% 0 0); }
        40%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }

      @keyframes animPixelify {
        0%, 39.9% { opacity: 0; clip-path: inset(0 100% 0 0); }
        40%       { opacity: 1; clip-path: inset(0 100% 0 0); }
        42%       { opacity: 1; }
        52%, 57%  { opacity: 1; clip-path: inset(0 0% 0 0); }
        59.8%     { opacity: 1; clip-path: inset(0 100% 0 0); }
        60%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }

      @keyframes animSyne {
        0%, 59.9% { opacity: 0; clip-path: inset(0 100% 0 0); }
        60%       { opacity: 1; clip-path: inset(0 100% 0 0); }
        62%       { opacity: 1; }
        72%, 77%  { opacity: 1; clip-path: inset(0 0% 0 0); }
        79.8%     { opacity: 1; clip-path: inset(0 100% 0 0); }
        80%, 100% { opacity: 0; clip-path: inset(0 100% 0 0); }
      }

      @keyframes animLogoFont {
        0%, 79.9% { opacity: 0; clip-path: inset(0 100% 0 0); }
        80%       { opacity: 1; clip-path: inset(0 100% 0 0); }
        82%       { opacity: 1; }
        92%, 97%  { opacity: 1; clip-path: inset(0 0% 0 0); }
        99.8%     { opacity: 1; clip-path: inset(0 100% 0 0); }
        100%      { opacity: 0; clip-path: inset(0 100% 0 0); }
      }

      @keyframes blinkCursor {
        0%, 49%   { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <rect class="canvas-bg" width="920" height="180"/>

  <!-- 1. OXANIUM -->
  <g class="font-oxanium">
    <text class="title-node" x="445" y="90">VATSAL BHAVSAR</text>
    <rect class="amber-cursor" x="735" y="62" width="3.5" height="56" rx="1.5"/>
  </g>

  <!-- 2. JETBRAINS MONO -->
  <g class="font-jetbrains">
    <text class="title-node" x="445" y="90">VATSAL_BHAVSAR</text>
    <rect class="amber-cursor" x="675" y="62" width="3.5" height="56" rx="1.5"/>
  </g>

  <!-- 3. PIXELIFY SANS -->
  <g class="font-pixelify">
    <text class="title-node" x="445" y="90">VATSAL BHAVSAR</text>
    <rect class="amber-cursor" x="715" y="62" width="3.5" height="56" rx="1.5"/>
  </g>

  <!-- 4. SYNE -->
  <g class="font-syne">
    <text class="title-node" x="445" y="90">VATSAL BHAVSAR</text>
    <rect class="amber-cursor" x="735" y="62" width="3.5" height="56" rx="1.5"/>
  </g>

  <!-- 5. VATSALLOGOFONT -->
  <g class="font-vatsallogo">
    <text class="title-node" x="445" y="90">VATSAL BHAVSAR</text>
    <rect class="amber-cursor" x="730" y="62" width="3.5" height="56" rx="1.5"/>
  </g>
</svg>
